<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bộ FlashCard Từ Vựng Tiếng Anh - Audio & Hiệu Ứng Nâng Cao</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Thanh tiến trình học */
    .progress-container {
      width: 360px;
      max-width: 90vw;
      height: 6px;
      background: #334155;
      border-radius: 999px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.3s ease;
    }

    .header-info {
      display: flex;
      justify-content: space-between;
      width: 360px;
      max-width: 90vw;
      margin-bottom: 16px;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* Khung hiển thị thẻ */
    .card-scene {
      width: 360px;
      max-width: 90vw;
      height: 490px;
      perspective: 1200px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
      cursor: pointer;
    }

    /* Hiệu ứng lật thẻ */
    .card.is-flipped {
      transform: rotateY(180deg);
    }

    /* Hiệu ứng chuyển động slide khi qua thẻ mới */
    .slide-out-left {
      transform: translateX(-80px) rotateY(-20deg) scale(0.9) !important;
      opacity: 0 !important;
    }
    .slide-in-right {
      transform: translateX(80px) rotateY(20deg) scale(0.9);
      opacity: 0;
    }
    .slide-out-right {
      transform: translateX(80px) rotateY(20deg) scale(0.9) !important;
      opacity: 0 !important;
    }
    .slide-in-left {
      transform: translateX(-80px) rotateY(-20deg) scale(0.9);
      opacity: 0;
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    /* Mặt trước */
    .card-front .image-wrapper {
      width: 100%;
      height: 250px;
      border-radius: 14px;
      overflow: hidden;
      background: #0f172a;
      position: relative;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card-scene:hover .card-front img {
      transform: scale(1.05);
    }

    .word-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: auto 0;
    }

    .word {
      font-size: 1.8rem;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
    }

    /* Nút phát âm */
    .speak-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.2rem;
    }

    .speak-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      transform: scale(1.1);
    }

    /* Mặt sau */
    .card-back {
      transform: rotateY(180deg);
      background: #0f172a;
      border-color: #38bdf8;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    .card-back .sub-word {
      font-size: 1.2rem;
      color: #94a3b8;
    }

    .card-back .meaning {
      font-size: 1.8rem;
      font-weight: 700;
      color: #4ade80;
      line-height: 1.4;
      padding: 0 10px;
    }

    .hint {
      font-size: 0.8rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Bảng điều khiển */
    .controls {
      display: flex;
      gap: 14px;
      margin-top: 24px;
      align-items: center;
    }

    button.btn-ctrl {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    button.btn-ctrl:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    button.btn-ctrl:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="header-info">
    <span>Ghi nhớ từ vựng</span>
    <span id="cardCounter">1 / 24</span>
  </div>

  <div class="card-scene">
    <div class="card" id="flashcard" onclick="flipCard()">
      <!-- Mặt trước: Từ vựng + Ảnh + Nút âm thanh -->
      <div class="card-face card-front">
        <div class="image-wrapper">
          <img id="cardImage" src="" alt="Từ vựng">
        </div>
        <div class="word-box">
          <div class="word" id="cardWord">word</div>
          <button class="speak-btn" title="Phát âm (phím V)" onclick="speakCurrentWord(event)">🔊</button>
        </div>
        <div class="hint">Chạm thẻ hoặc bấm Space để lật</div>
      </div>

      <!-- Mặt sau: Nghĩa tiếng Việt -->
      <div class="card-face card-back">
        <div class="sub-word" id="cardBackWord">word</div>
        <div class="meaning" id="cardMeaning">nghĩa</div>
        <div class="hint">Chạm thẻ để quay lại</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-ctrl" onclick="changeCard('prev')">← Trước</button>
    <button class="btn-ctrl" onclick="flipCard()">Lật thẻ</button>
    <button class="btn-ctrl" onclick="changeCard('next')">Tiếp theo →</button>
  </div>

  <script>
    const vocabularyList = [
      { word: "injured", meaning: "bị thương", img: "https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=600&q=80" },
      { word: "operated", meaning: "vận hành / phẫu thuật", img: "https://images.unsplash.com/photo-1551076805-e1869033e561?auto=format&fit=crop&w=600&q=80" },
      { word: "young", meaning: "trẻ tuổi", img: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80" },
      { word: "youth", meaning: "tuổi trẻ", img: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&q=80" },
      { word: "account", meaning: "câu chuyện / tài khoản", img: "https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&w=600&q=80" },
      { word: "death", meaning: "cái chết", img: "https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=600&q=80" },
      { word: "devoting to", meaning: "cống hiến", img: "https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&fit=crop&w=600&q=80" },
      { word: "(to) bond", meaning: "gắn bó", img: "https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=600&q=80" },
      { word: "cutting-edge", meaning: "tiên tiến, hiện đại", img: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=600&q=80" },
      { word: "blockbuster", meaning: "bom tấn", img: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80" },
      { word: "(to) diagnose", meaning: "chẩn đoán", img: "https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=600&q=80" },
      { word: "visionary", meaning: "có tầm nhìn", img: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=600&q=80" },
      { word: "adopted", meaning: "nhận nuôi", img: "https://images.unsplash.com/photo-1536640712-4d4c36ff0e4e?auto=format&fit=crop&w=600&q=80" },
      { word: "dropped out", meaning: "nghỉ học, bỏ học", img: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=600&q=80" },
      { word: "cancer", meaning: "bệnh ung thư", img: "https://images.unsplash.com/photo-1576765608535-5f04d1e3f289?auto=format&fit=crop&w=600&q=80" },
      { word: "passed away", meaning: "qua đời", img: "https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?auto=format&fit=crop&w=600&q=80" },
      { word: "genius", meaning: "thiên tài", img: "https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=600&q=80" },
      { word: "intelligent", meaning: "thông minh", img: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80" },
      { word: "ordinary", meaning: "bình thường", img: "https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=600&q=80" },
      { word: "stopped working = resigned", meaning: "nghỉ việc, từ chức", img: "https://images.unsplash.com/photo-1450133064473-71024230f91b?auto=format&fit=crop&w=600&q=80" },
      { word: "continue", meaning: "tiếp tục", img: "https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?auto=format&fit=crop&w=600&q=80" },
      { word: "the communist party", meaning: "đảng cộng sản", img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&w=600&q=80" },
      { word: "battle", meaning: "trận chiến", img: "https://images.unsplash.com/photo-1569420065910-67dfb6a71872?auto=format&fit=crop&w=600&q=80" },
      { word: "campaign", meaning: "chiến dịch", img: "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=600&q=80" }
    ];

    let currentIndex = 0;
    let isTransitioning = false;

    const card = document.getElementById("flashcard");
    const cardWord = document.getElementById("cardWord");
    const cardBackWord = document.getElementById("cardBackWord");
    const cardMeaning = document.getElementById("cardMeaning");
    const cardImage = document.getElementById("cardImage");
    const counter = document.getElementById("cardCounter");
    const progressBar = document.getElementById("progressBar");

    function updateContent() {
      const item = vocabularyList[currentIndex];
      cardWord.textContent = item.word;
      cardBackWord.textContent = item.word;
      cardMeaning.textContent = item.meaning;
      cardImage.src = item.img;
      counter.textContent = `${currentIndex + 1} / ${vocabularyList.length}`;
      progressBar.style.width = `${((currentIndex + 1) / vocabularyList.length) * 100}%`;
    }

    function flipCard() {
      card.classList.toggle("is-flipped");
    }

    // Hiệu ứng chuyển thẻ mượt mà
    function changeCard(direction) {
      if (isTransitioning) return;
      isTransitioning = true;

      const outClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
      const inClass = direction === 'next' ? 'slide-in-right' : 'slide-in-left';

      card.classList.add(outClass);

      setTimeout(() => {
        card.classList.remove("is-flipped", outClass);
        if (direction === 'next') {
          currentIndex = (currentIndex + 1) % vocabularyList.length;
        } else {
          currentIndex = (currentIndex - 1 + vocabularyList.length) % vocabularyList.length;
        }
        updateContent();

        // Chuẩn bị vị trí xuất hiện ở phía đối diện
        card.classList.add(inClass);
        
        requestAnimationFrame(() => {
          setTimeout(() => {
            card.classList.remove(inClass);
            isTransitioning = false;
          }, 30);
        });
      }, 250);
    }

    // Phát âm từ vựng
    function speakCurrentWord(event) {
      if (event) event.stopPropagation(); // Không kích hoạt lật thẻ khi bấm loa

      if (!('speechSynthesis' in window)) {
        alert("Trình duyệt không hỗ trợ phát âm trực tiếp.");
        return;
      }

      window.speechSynthesis.cancel(); // Dừng câu đang đọc dở

      let rawText = vocabularyList[currentIndex].word;
      // Làm sạch các từ thừa trước khi đọc (bỏ dấu ngoặc, lấy từ chính trước dấu =)
      let cleanText = rawText.replace(/\(.*?\)/g, "").replace(/=.*/g, "").trim();

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'en-US';
      utterance.rate = 0.9; // Tốc độ chuẩn, dễ nghe
      window.speechSynthesis.speak(utterance);
    }

    // Phím tắt điều khiển:
    // - Space: Lật mặt thẻ
    // - Mũi tên Phải: Thẻ kế tiếp
    // - Mũi tên Trái: Thẻ trước đó
    // - Phím V: Đọc phát âm từ vựng
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      } else if (e.code === "ArrowRight") {
        changeCard('next');
      } else if (e.code === "ArrowLeft") {
        changeCard('prev');
      } else if (e.key === "v" || e.key === "V") {
        speakCurrentWord();
      }
    });

    updateContent();
  </script>
</body>
</html>
